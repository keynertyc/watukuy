name: Release
# Publishes the version committed in package.json (versioning is done locally with Changesets;
# see RELEASING.md). Manual for now: run it from the Actions tab. Switch `on:` to
# `push: { branches: [main] }` to publish automatically whenever main carries an unpublished version.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Resolve version and dist-tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node -p "const v=require('./package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'")
          if npm view "watukuy@${VERSION}" version >/dev/null 2>&1; then PUBLISHED=true; else PUBLISHED=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "watukuy@$VERSION → dist-tag '$TAG' (already published: $PUBLISHED)"
      - name: Publish to npm with provenance (trusted publishing or NPM_TOKEN)
        if: steps.meta.outputs.published == 'false'
        run: pnpm publish --access public --tag "${{ steps.meta.outputs.tag }}" --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Verify (retries while the registry propagates)
        run: |
          for i in $(seq 1 12); do
            if npm view "watukuy@${{ steps.meta.outputs.version }}" version dist.attestations.url; then exit 0; fi
            echo "not visible yet (attempt $i), waiting 10s"; sleep 10
          done
          echo "package not visible on the registry after 2 minutes" >&2; exit 1
